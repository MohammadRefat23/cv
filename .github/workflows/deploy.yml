name: Build and Deploy CV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cv-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CV repository
        uses: actions/checkout@v6

      - name: Compile CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex
          working_directory: .
          os: debian

      - name: Prepare Pages site
        run: |
          mkdir -p _site

          cp cv.pdf _site/cv.pdf
          cp index.html _site/index.html
          touch _site/.nojekyll

          if [ ! -s _site/cv.pdf ]; then
            echo "The CV PDF was not generated correctly."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy CV
        id: deployment
        uses: actions/deploy-pages@v4
