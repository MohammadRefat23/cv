<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Curriculum Vitae | Mohammad Alvi Refat</title>

  <style>
    :root {
      --background: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .page {
      width: min(1200px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.25rem;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.15;
    }

    .subtitle {
      margin: 0.45rem 0 0;
      color: var(--muted);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.7rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 0.5rem;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 650;
      text-decoration: none;
    }

    .button:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .viewer {
      overflow: hidden;
      width: 100%;
      height: calc(100vh - 220px);
      min-height: 700px;
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      background: var(--surface);
      box-shadow:
        0 1px 2px rgb(0 0 0 / 5%),
        0 8px 24px rgb(0 0 0 / 6%);
    }

    .viewer iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--surface);
    }

    @media (max-width: 640px) {
      .page {
        width: calc(100% - 1rem);
        padding-top: 1rem;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .button {
        width: 100%;
      }

      .viewer {
        height: calc(100vh - 270px);
        min-height: 500px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a
      class="back-link"
      href="https://mohammadrefat23.github.io/"
    >
      ← Back to main website
    </a>

    <header class="header">
      <div>
        <h1>Curriculum Vitae</h1>
        <p class="subtitle">Mohammad Alvi Refat</p>
      </div>

      <a
        class="button"
        href="./cv.pdf"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open in New Tab
      </a>
    </header>

    <section class="viewer">
      <iframe
        src="./cv.pdf#view=FitH"
        title="Mohammad Alvi Refat Curriculum Vitae"
      >
        <p>
          Your browser cannot display the PDF.
          <a href="./cv.pdf" target="_blank">
            Open the CV directly.
          </a>
        </p>
      </iframe>
    </section>
  </main>
</body>
</html>
